function update(saveIt=true){let o=0,x=0,na=0,done=0;DATA.forEach(i=>{const s=state[i.id];if(s.status==="O")o++;if(s.status==="X")x++;if(s.status==="/")na++;if(s.status)done++});
const pct=Math.round(done/DATA.length*100);document.getElementById("percent").textContent=pct+"%";document.getElementById("fill").style.width=pct+"%";
document.getElementById("count").textContent=done+" / "+DATA.length;document.getElementById("ok").textContent="合格 "+o;document.getElementById("bad").textContent="不合格 "+x;document.getElementById("na").textContent="無此項 "+na;if(saveIt)persist()}
function val(id){return document.getElementById(id).value}
function persist(){localStorage.setItem("dacheng-checklist",JSON.stringify({state,project:val("project"),unit:val("unit"),date:val("date"),time:val("time"),other:val("other"),inspector:val("inspector")}))}
function save(){persist();alert("已儲存到本瀏覽器。")}
function load(){const raw=localStorage.getItem("dacheng-checklist");if(!raw)return;try{const d=JSON.parse(raw);Object.assign(state,d.state||{});["project","unit","date","time","other","inspector"].forEach(k=>{if(d[k]!=null)document.getElementById(k).value=d[k]})}catch(e){}}
function resetAll(){if(!confirm("確定要清除所有檢查結果與資料嗎？"))return;localStorage.removeItem("dacheng-checklist");DATA.forEach(x=>state[x.id]={status:"",note:""});document.getElementById("unit").value="";document.getElementById("date").value="";document.getElementById("time").value="";document.getElementById("other").value="";document.getElementById("inspector").value="";render()}

const API_URL = "https://script.google.com/macros/s/AKfycbwaDMKDy0CWGWe93pT_8xK6ZoyWu7hwaOjI4CHrw_VFUbb2z3rAmPXKH1nrdwSp1JLH/exec";
function makeSubmissionId(){return "INS-"+new Date().toISOString().replace(/[-:.TZ]/g,"").slice(0,14)+"-"+Math.random().toString(36).slice(2,8).toUpperCase()}
function buildPayload(){const items={};DATA.forEach(i=>items[i.id]={question:i.question,section:i.section,status:state[i.id].status||"",note:state[i.id].note||""});return{submissionId:makeSubmissionId(),project:val("project"),unit:val("unit"),date:val("date"),time:val("time"),inspector:val("inspector"),other:val("other"),submittedAt:new Date().toISOString(),items}}
function submitToBackend(){
 if(!API_URL||API_URL.includes("請貼上")){alert("尚未設定後台 API。");return}
 const unanswered=DATA.filter(i=>!state[i.id].status).length;
 if(unanswered&&!confirm(`目前還有 ${unanswered} 項未檢查，確定要送出嗎？`))return;

 const payload=buildPayload();
 localStorage.setItem("dacheng-last-submission",JSON.stringify({submissionId:payload.submissionId,submittedAt:payload.submittedAt}));

 // v3.1.1：改用使用者點擊事件直接開啟 POST 結果頁。
 // 不再依賴 hidden iframe，提升 iPhone / Safari 的相容性。
 const form=document.createElement("form");
 form.method="POST";
 form.action=API_URL;
 form.target="_blank";
 form.style.display="none";

 const input=document.createElement("input");
 input.type="hidden";
 input.name="payload";
 input.value=JSON.stringify(payload);

 form.appendChild(input);
 document.body.appendChild(form);
 form.submit();

 setTimeout(()=>form.remove(),1000);

 const el=document.getElementById("backendStatus");
 el.textContent=" 已送出；手機會開啟 Google 回應頁，看到 ok:true 即代表後台已收到";
 alert("已送出後台。手機若開啟 Google 回應頁並看到 ok:true，即代表 Spreadsheet 已收到資料；可直接關閉該頁回到驗屋表。");
}

function testApi(){
 window.open(API_URL,"_blank");
}
["project","unit","date","time","other","inspector"].forEach(id=>document.getElementById(id).addEventListener("input",()=>update()));load();render();
